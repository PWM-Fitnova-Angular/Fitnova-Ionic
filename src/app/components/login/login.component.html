<ion-header>
  <ion-toolbar>
    <ion-title>Log In</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>
  <ion-card>
    <ion-card-header>
      <ion-card-title>Welcome to Fitnova</ion-card-title>
    </ion-card-header>
    <ion-card-content>
      <ion-item>
        <ion-label position="floating">Email</ion-label>
        <ion-input [(ngModel)]="email" type="email" required="" ></ion-input>
      </ion-item>
      <ion-item>
        <ion-label position="floating" >Password</ion-label>
        <ion-input [(ngModel)]="password" type="email" required="" ></ion-input>
      </ion-item>
      <ion-button (click)="login()" type="password" > Log In</ion-button>
      <ion-button [routerLink]="['/register']"  >Register</ion-button>
    </ion-card-content>

  </ion-card>
</ion-content>
