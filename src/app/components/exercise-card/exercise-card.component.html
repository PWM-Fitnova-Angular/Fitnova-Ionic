<ion-card class="card">

  <input
    type="file"
    #fileInput
    hidden
    accept="image/*"
    (change)="onFileSelected($event)"
  />

  <ion-card-content (click)="showDetails(cardObject)" class="card-link">

    <ion-chip color="primary" class="card-label">
      {{ cardLabel }}
    </ion-chip>

    <!-- Imagen -->
    <div class="image-grid" [ngClass]="{ 'edit-mode': isEditMode }">
      <img [src]="cardImage" alt="{{cardImage}}" class="card-image" />


      <div class="image-overlay" *ngIf="isEditMode">
        <div class="overlay-content">
          <div class="camera-icon">
            <ion-icon name="camera"></ion-icon>
            <span>Click para subir imagen</span>
          </div>


          <div class="overlay-actions" *ngIf="selectedFile">
            <ion-button
              color="success"
              size="small"
              fill="solid"
              class="action-btn save-btn"
              [disabled]="isUploading"
              (click)="uploadImage($event)"
            >
              <ion-icon slot="start" name="checkmark"></ion-icon>
              Guardar
            </ion-button>

            <ion-button
              color="medium"
              size="small"
              fill="outline"
              class="action-btn cancel-btn"
              [disabled]="isUploading"
              (click)="cancelEdit($event)"
            >
              <ion-icon slot="start" name="close"></ion-icon>
              Cancelar
            </ion-button>
          </div>
        </div>


        <div class="loading-indicator" *ngIf="isUploading">
          <ion-spinner name="crescent"></ion-spinner>
          <span>Subiendo...</span>
        </div>
      </div>
    </div>


    <ion-label class="card-title">{{ cardTitle }}</ion-label>
    <ion-icon name="information-circle" class="card-icon"></ion-icon>
  </ion-card-content>
</ion-card>
